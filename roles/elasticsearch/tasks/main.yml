- name: set hostname
  ansible.builtin.shell: set-hostname elasticsearch

- name: Copy Elastic Repo file
  ansible.builtin.template:
    src: elastic.repo
    dest: /etc/yum.repos.d/elastic.repo

- name: Install ELK Stack
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: installed
  loop:
    - elasticsearch
    - kibana
    - logstash
    - nginx

- name: Fix Elasticsearch directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: elasticsearch
    group: elasticsearch
    recurse: yes
  loop:
    - /etc/elasticsearch
    - /var/lib/elasticsearch
    - /var/log/elasticsearch


- name: Copy Nginx Config file
  ansible.builtin.template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf

- name: Copy Logstash config
  ansible.builtin.template:
    src: logstash.conf
    dest: /etc/logstash/conf.d/logstash.conf

- name: List Elasticsearch keystore entries
  become: yes
  become_user: elasticsearch
  command: /usr/share/elasticsearch/bin/elasticsearch-keystore list
  register: es_keystore_list
  changed_when: false
  failed_when: false

- name: Remove transport keystore password if present
  become: yes
  become_user: elasticsearch
  command: /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.transport.ssl.keystore.secure_password
  when: "'xpack.security.transport.ssl.keystore.secure_password' in es_keystore_list.stdout"

- name: Remove transport truststore password if present
  become: yes
  become_user: elasticsearch
  command: /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.transport.ssl.truststore.secure_password
  when: "'xpack.security.transport.ssl.truststore.secure_password' in es_keystore_list.stdout"


- name: Start ELK Stack
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - elasticsearch
    - kibana
    - logstash
    - nginx