- name: Set Hostname For Server
  ansible.builtin.shell: set-hostname jenkins

- name: Copy Jenkins Repo File
  ansible.builtin.template:
    src: jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo

- name: Install Jenkins
  ansible.builtin.dnf:
    name:
      - fontconfig
      - java-17-openjdk
      - jenkins
    state: installed

- name: Ensure Java 17 is default
  ansible.builtin.shell: alternatives --set java /usr/lib/jvm/java-17-openjdk*/bin/java

- name: Start Jenkins Service
  ansible.builtin.systemd_service:
    name: jenkins
    state: restarted
    enabled: true

- name: Create a Job
  community.general.jenkins_job:
    config: "{{ lookup('template', 'templates/pipeline.xml') }}"
    name: "{{repo_name}}"
    password: admin123
    url: http://jenkins-int.kdevops.online:8080
    user: admin
  loop:
    - frontend