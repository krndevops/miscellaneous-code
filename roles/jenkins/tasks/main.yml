- name: Create Multi Branch Pipeline Jobs
  community.general.jenkins_job:
    config: "{{ lookup('template', 'templates/multibranch.xml') }}"
    name: "{{item}}"
    password: admin
    url: http://jenkins-int.kdevops.online:8080
    user: admin
  loop:
    - frontend
    - catalogue
    - cart
    - user
    - payment
    - shipping