- name: Set Hostname For Server
  ansible.builtin.shell: set-hostname jenkins

- name: Copy Jenkins Repo File
  ansible.builtin.template:
    src: jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo

- name: Install Jenkins
  ansible.builtin.dnf:
    name:
      - fontconfig
      - java-17-openjdk
      - jenkins
    state: installed

- name: Ensure Java 17 is default
  ansible.builtin.shell: alternatives --set java /usr/lib/jvm/java-17-openjdk*/bin/java

- name: Install Jenkins Python Library
  ansible.builtin.dnf:
    name: python3-jenkins.noarch
    state: installed

- name: Start Jenkins Service
  ansible.builtin.systemd_service:
    name: jenkins
    state: restarted
    enabled: true

