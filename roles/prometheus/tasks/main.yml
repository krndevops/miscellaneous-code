- name: Download Prometheus
  ansible.builtin.unarchive:
    src: https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz
    dest: /opt
    remote_src: yes

- name: Copy Prometheus service file
  ansible.builtin.template:
    src: prometheus.service
    dest: /etc/systemd/system/prometheus.service

- name: Copy Prometheus Server configuration
  ansible.builtin.template:
    src: prometheus.yml
    dest: /opt/prometheus-{{prometheus_version}}.linux-amd64/prometheus.yml

- name: Copy Prometheus Alerts configuration
  ansible.builtin.template:
    src: alerts.yml
    dest: /opt/prometheus-{{prometheus_version}}.linux-amd64/alerts.yml

- name: Start and enable Prometheus service
  ansible.builtin.systemd_service:
      name: prometheus
      state: restarted
      enabled: yes
      daemon_reload: yes

- name: Wait for Prometheus port
  ansible.builtin.shell: sleep 5; netstat -lntp | grep 9090

- name: Import Grafana GPG key
  rpm_key:
    state: present
    key: https://rpm.grafana.com/gpg.key

- name: Check Grafana service
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
    enabled: yes
  register: out
  ignore_errors: true

- name: Install Grafana
  ansible.builtin.dnf:
    name: https://dl.grafana.com/grafana-enterprise/release/12.3.1/grafana-enterprise_12.3.1_20271043721_linux_amd64.rpm
    state: installed
  when: out.failed

- name: Start and enable Grafana service
  ansible.builtin.systemd_service:
      name: grafana-server
      state: restarted
      enabled: yes
  when: out.failed

- name: Copy Grafana Json File
  ansible.builtin.copy:
    src: grafana-expense.json
    dest: /tmp/grafana-expense.json

- name: Import Grafana dashboard foo
  community.grafana.grafana_dashboard:
    grafana_url: https://grafana.kdevops.online
    grafana_api_key: "{{ lookup('amazon.aws.aws_ssm', 'grafana.apikey', region='us-east-1' ) }}"
    state: present
    commit_message: Updated by ansible
    overwrite: true
    path: /tmp/grafana-expense.json



