- name: Set Hostname
  ansible.builtin.shell: set-hostname sonarqube

- name: Add Sonarqube user
  ansible.builtin.user:
   name: sonarqube

- name: Download Temurin 21 tarball
  ansible.builtin.get_url:
    url: https://github.com/adoptium/temurin21-binaries/releases/latest/download/OpenJDK21U-jdk_x64_linux_hotspot.tar.gz
    dest: /opt/OpenJDK21U-jdk_x64_linux_hotspot.tar.gz
    mode: '0644'

- name: Extract Temurin 21
  ansible.builtin.unarchive:
    src: /opt/OpenJDK21U-jdk_x64_linux_hotspot.tar.gz
    dest: /opt/
    remote_src: yes

- name: Create Java symlink
  ansible.builtin.file:
    src: /opt/jdk-21
    dest: /opt/java21
    state: link

- name: Set vm.max_map_count for SonarQube
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "524288"
    state: present
    reload: yes

- name: Downlad Sonarqube
  ansible.builtin.unarchive:
    src: https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-26.2.0.119303.zip
    dest: /home/sonarqube
    remote_src: yes
    owner: sonarqube
    group: sonarqube
    recurse: yes


- name: Copy Sonarqube service file
  ansible.builtin.template:
    src: sonarqube.service
    dest: /etc/systemd/system/sonarqube.service



- name: Start Sonarqube service
  ansible.builtin.systemd_service:
    name: sonarqube
    daemon_reload: true
    state: restarted
    enabled: true
