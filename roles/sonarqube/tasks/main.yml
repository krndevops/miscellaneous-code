- name: Set Hostname
  ansible.builtin.shell: set-hostname sonarqube

- name: Add Sonarqube user
  ansible.builtin.user:
    name: sonarqube

- name: Downlad Sonarqube
  ansible.builtin.unarchive:
    src: https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-26.2.0.119303.zip
    dest: /home/sonarqube
    remote_src: yes
    owner: sonarqube
    group: sonarqube

- name: Install Java
  ansible.builtin.dnf:
    name: java-21-openjdk.x86_64
    state: installed

- name: Copy Sonarqube service file
  ansible.builtin.template:
    src: sonarqube.service
    dest: /etc/systemd/system/sonarqube.service

- name: Start Sonarqube service
  ansible.builtin.systemd_service:
    name: sonarqube
    state: restarted
    enabled: true