- name: Set Hostname
  ansible.builtin.shell: set-hostname sonarqube

- name: Add Sonarqube user
  ansible.builtin.user:
    name: sonarqube

- name: Downlad Sonarqube
  ansible.builtin.unarchive:
    src: https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-26.2.0.119303.zip
    dest: /home/sonarqube
    remote_src: yes
    owner: sonarqube
    group: sonarqube

- name: Install Java
  ansible.builtin.dnf:
      name:
        - java-17-openjdk
        - java-17-openjdk-devel
      state: installed

- name: Set Java 17 as default alternative
  ansible.builtin.alternatives:
    name: java
    path: /usr/lib/jvm/java-17-openjdk/bin/java

- name: Set Javac 17 as default alternative
  ansible.builtin.alternatives:
     name: javac
     path: /usr/lib/jvm/java-17-openjdk/bin/javac

- name: Copy Sonarqube service file
  ansible.builtin.template:
    src: sonarqube.service
    dest: /etc/systemd/system/sonarqube.service

- name: Start Sonarqube service
  ansible.builtin.systemd_service:
    name: sonarqube
    state: restarted
    enabled: true