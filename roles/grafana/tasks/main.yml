- name: Import Grafana GPG key
  rpm_key:
    state: present
    key: https://rpm.grafana.com/gpg.key

- name: Check Grafana service
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
    enabled: yes
  register: out
  ignore_errors: true

- name: Install Grafana
  ansible.builtin.dnf:
    name: https://dl.grafana.com/grafana-enterprise/release/12.3.1/grafana-enterprise_12.3.1_20271043721_linux_amd64.rpm
    state: installed
  when: out.failed

- name: Start and enable Grafana service
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
    enabled: yes
  when: out.failed

- name: Copy Grafana Json File
  ansible.builtin.template:
    src: grafana-expense.json
    dest: /tmp/grafana-expense.json

- name: Import Grafana dashboard foo
  community.grafana.grafana_dashboard:
    grafana_url: http://grafana-int.kdevops.online:3000
    grafana_api_key: "{{ lookup('amazon.aws.aws_ssm', 'grafana.apikey', region='us-east-1' ) }}"
    state: present
    commit_message: Updated by ansible
    overwrite: true
    path: /tmp/grafana-expense.json
